<html lang="es">
<head>

<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one-screen register. Sticky day header, scrolling working area, fixed bottom tabs. Ticket card reads like a fonda receipt. */
:root{
  --bg:#4A9FD8; --surface:#2F7FBA; --ink:#FFFFFF; --muted:#DCEEFB; --line:#7DB8E3;
  --tab-on:#FFFFFF; --tab-off:rgba(255,255,255,.62);
  --accent:#B3122B; --accent-ink:#FFFFFF; --accent-soft:#F9DCE0;
  --accent-grad:linear-gradient(135deg,#D7263D 0%,#A30F25 100%);
  --chip-bg:linear-gradient(135deg,rgba(255,255,255,.24) 0%,rgba(255,255,255,.10) 100%); --chip-border:rgba(255,255,255,.55);
  --sazon:#FFD27A; --sazon-soft:#2A6FA6; --danger:#B3261E; --danger-soft:#F8DEDB;
  --f-display:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#4A9FD8; --surface:#2F7FBA; --ink:#FFFFFF; --muted:#DCEEFB; --line:#7DB8E3;
  --tab-on:#FFFFFF; --tab-off:rgba(255,255,255,.62);
  --accent:#B3122B; --accent-ink:#FFFFFF; --accent-soft:#F9DCE0;
  --accent-grad:linear-gradient(135deg,#D7263D 0%,#A30F25 100%);
  --chip-bg:linear-gradient(135deg,rgba(255,255,255,.24) 0%,rgba(255,255,255,.10) 100%); --chip-border:rgba(255,255,255,.55);
  --sazon:#FFD27A; --sazon-soft:#2A6FA6; --danger:#F2867D; --danger-soft:#3C1C19; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#4A9FD8; --surface:#2F7FBA; --ink:#FFFFFF; --muted:#DCEEFB; --line:#7DB8E3;
  --tab-on:#FFFFFF; --tab-off:rgba(255,255,255,.62);
  --accent:#B3122B; --accent-ink:#FFFFFF; --accent-soft:#F9DCE0;
  --accent-grad:linear-gradient(135deg,#D7263D 0%,#A30F25 100%);
  --chip-bg:linear-gradient(135deg,rgba(255,255,255,.24) 0%,rgba(255,255,255,.10) 100%); --chip-border:rgba(255,255,255,.55);
  --sazon:#FFD27A; --sazon-soft:#2A6FA6; --danger:#F2867D; --danger-soft:#3C1C19; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line);display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.01em;line-height:1}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.02em;margin-top:4px;text-transform:capitalize}
.todaybox{text-align:right}
.todaybox .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.todaybox .amt{font-family:var(--f-num);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums}
.banner{margin-top:12px;padding:10px 12px;border-radius:var(--r);background:var(--danger-soft);color:var(--danger);font-size:13px}
main{display:flex;flex-direction:column;gap:18px;padding-top:16px}
h2{font-family:var(--f-display);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 8px}
.group{display:flex;flex-direction:column}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1.5px solid var(--chip-border,var(--line));background:var(--chip-bg,var(--surface));color:var(--ink);font:600 15px var(--f-body);padding:10px 14px;border-radius:999px;min-height:44px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-grad,var(--accent));border-color:var(--accent);color:var(--accent-ink)}
.chip:focus-visible,.btn:focus-visible,.seg button:focus-visible,.step button:focus-visible,input:focus-visible,.tab:focus-visible,.link:focus-visible{outline:3px solid var(--sazon);outline-offset:2px}
.ticket{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line);position:relative}
.ticket::before{content:"";position:absolute;left:12px;right:12px;top:-1px;border-top:2px dashed var(--line)}
.ticket .name{font-family:var(--f-display);font-weight:600;font-size:18px;line-height:1.25;text-wrap:balance}
.ticket .name.empty{color:var(--muted);font-family:var(--f-body);font-weight:500;font-size:15px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.step{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.step button{appearance:none;border:0;background:transparent;color:var(--ink);width:48px;height:44px;font:700 22px var(--f-body);cursor:pointer}
.step output{min-width:44px;text-align:center;font:600 18px var(--f-num)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--bg);padding:4px;border-radius:12px;border:1px solid var(--line)}
.seg button{appearance:none;border:0;background:transparent;color:var(--ink);font:600 14px var(--f-body);padding:10px 4px;border-radius:9px;min-height:42px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-grad,var(--surface));box-shadow:0 1px 2px rgba(0,0,0,.12);color:var(--accent-ink)}
.btn{appearance:none;border:0;border-radius:14px;background:var(--accent-grad,var(--accent));color:var(--accent-ink);font:700 17px var(--f-body);padding:15px 18px;min-height:54px;width:100%;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.btn .num{font-weight:600}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--accent-soft);color:var(--accent);font-size:15px;min-height:46px;padding:11px 14px}
.btn.sazon{background:var(--sazon-soft);color:var(--ink);font-size:15px;min-height:46px;padding:11px 14px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=password],input[type=number],input[type=date],input[inputmode]{font:500 16px var(--f-body);color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;min-height:46px;width:100%}
input::placeholder{color:var(--muted);opacity:.7}
/* Date fields: never wider than their column (iOS gives them a large intrinsic width), visible calendar icon */
.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.two>*{min-width:0}
input[type=date]{display:block;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;padding-right:8px;font-size:15px}
input[type=date]::-webkit-date-and-time-value{text-align:left}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.9;cursor:pointer;margin-left:4px}
@media (max-width:480px){.two.fechas{grid-template-columns:minmax(0,1fr)}}
.group>.row{margin-bottom:8px;flex-wrap:nowrap}
[id^="hx-"]{scroll-margin-top:120px}
.group>.row h2{margin:0}
.link.editlink{color:var(--ink);background:rgba(255,255,255,.16);border-radius:999px;padding:6px 14px;white-space:nowrap}
#btnHoyEdit{background:linear-gradient(135deg,#FDDB4F 0%,#FCD12B 100%);color:#1B2633;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.link#btnHoyEdit{border-radius:999px;padding:8px 16px;font-weight:700}
input.big{font:600 30px var(--f-num);padding:10px 14px;text-align:right}
.pricefix{background:var(--sazon-soft);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.lines{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.line{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.line .what{flex:1;min-width:0}
.line .what b{display:block;font-weight:600;overflow-wrap:anywhere}
.line .what span{font-size:12px;color:var(--muted)}
.line .amt{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.line .amt.out{color:var(--danger)}
.link{appearance:none;border:0;background:none;color:var(--muted);font:600 13px var(--f-body);padding:8px;cursor:pointer;border-radius:8px}
.link.danger{color:var(--danger)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tile .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tile .v{font-family:var(--f-num);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums}
.tile.neg .v{color:var(--danger)}
.tile.pos .v{color:var(--accent)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{padding:18px;border:1.5px dashed var(--line);border-radius:var(--r);color:var(--muted);text-align:center;font-size:14px}
textarea.fallback{width:100%;min-height:120px;font:500 12px var(--f-num);border:1.5px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);color:var(--ink)}
.menu-row{display:grid;grid-template-columns:1fr 92px 36px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.menu-row b{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.menu-row input{min-height:40px;padding:8px;font:600 15px var(--f-num);text-align:right}
.chipx{display:inline-flex;align-items:center;gap:2px;border:1.5px solid var(--line);border-radius:999px;padding:4px 4px 4px 12px;background:var(--surface);font-weight:600;font-size:14px}
.chipx button{appearance:none;border:0;background:none;color:var(--muted);font:700 16px var(--f-body);width:30px;height:30px;border-radius:50%;cursor:pointer}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0}
.addrow .btn{width:auto;min-height:46px;padding:0 16px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{appearance:none;border:0;background:none;color:var(--muted);font:600 12px var(--f-body);padding:8px 2px 10px;min-height:58px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab{color:var(--tab-off,var(--muted))}
.tab[aria-current="page"]{color:var(--tab-on,var(--accent));font-weight:800}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100% - 32px);text-align:center}
.confirm{display:flex;gap:6px;align-items:center}
.note{font-size:13px;color:var(--muted)}
.chip .n{display:inline-block;min-width:22px;margin-left:6px;padding:0 6px;border-radius:999px;background:var(--accent-ink);color:var(--accent);font:700 13px var(--f-num)}
.chip.has{background:var(--accent-grad,var(--accent));border-color:var(--accent);color:var(--accent-ink)}
.tlines{display:flex;flex-direction:column;gap:6px}
.tline{display:flex;align-items:center;gap:8px}
.tline .what{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.tline .num{white-space:nowrap}
.mini{appearance:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);width:34px;height:34px;border-radius:50%;font:700 18px var(--f-body);cursor:pointer;flex:none}
.mini:focus-visible{outline:3px solid var(--sazon);outline-offset:2px}
.total{border-top:2px dashed var(--line);padding-top:10px}
.chip .ex{font:600 12px var(--f-num);opacity:.8;margin-left:4px}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.pill.g{background:var(--danger-soft);color:var(--danger)}
.pill.m{background:var(--sazon-soft);color:var(--sazon)}
.vgrid{display:flex;flex-direction:column;gap:18px}
.vmenu,.vticket{display:flex;flex-direction:column;gap:18px;min-width:0}
/* Tablet (landscape or large portrait): menu on the left, live ticket on the right, bigger touch targets */
@media (min-width:860px){
  .wrap{max-width:1180px}
  nav.tabs .in{max-width:1180px}
  .vgrid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}
  .vticket{position:sticky;top:112px;max-height:calc(100vh - 128px);overflow-y:auto;padding-bottom:4px}
  .chips{gap:10px}
  .chip{font-size:17px;padding:12px 18px;min-height:56px}
  .chip .ex{font-size:13px}
  .seg button{font-size:16px;min-height:54px}
  .btn{font-size:20px;min-height:68px}
  .btn.ghost,.btn.sazon{font-size:17px;min-height:54px}
  .step button{width:60px;height:56px;font-size:26px}
  .step output{min-width:56px;font-size:22px}
  .mini{width:44px;height:44px;font-size:22px}
  .ticket .name{font-size:22px}
  .line .what b{font-size:16px}
  .line .amt{font-size:16px}
  .line{padding:12px 0}
  .tline .what{font-size:16px}
  .link{font-size:15px;padding:12px}
  h2{font-size:14px}
  .tab{font-size:14px;min-height:64px}
  input[type=text],input[type=password],input[type=number],input[type=date],input[inputmode]{font-size:18px;min-height:52px}
}
@media (prefers-reduced-motion:no-preference){.chip,.btn,.seg button{transition:background-color .12s,color .12s,border-color .12s,transform .08s}.btn:active,.chip:active{transform:scale(.98)}}
html,body{margin:0}
.syncpill{appearance:none;border:0;background:rgba(255,255,255,.18);color:var(--ink);font:600 12px var(--f-body);padding:4px 10px;border-radius:999px;margin-top:4px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.syncpill .dot{width:8px;height:8px;border-radius:50%;background:#7CE38B;flex:none}
.syncpill.pend .dot{background:#FFD27A}
.syncpill.err .dot,.syncpill.off .dot{background:#FF8A80}
.cxstate{border-radius:10px;padding:10px 12px;background:rgba(255,255,255,.14);font-size:14px}
.preciorow{display:flex;align-items:flex-end;gap:10px}
.preciorow input{font:600 20px var(--f-num);text-align:right}
.preciorow .link{white-space:nowrap;margin-bottom:4px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">Caja Criolla<small id="hdrDate"></small></div>
    <div class="todaybox"><div class="lbl">Vendido hoy</div><div class="amt" id="hdrTotal">$0.00</div><button class="syncpill" id="hdrSync" type="button"><span class="dot"></span><span id="hdrSyncT">…</span></button></div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Secciones"><div class="in">
  <button class="tab" data-tab="vender" id="tab-vender"><svg viewBox="0 0 24 24"><path d="M4 7h16l-1.5 10.5a2 2 0 0 1-2 1.5h-9a2 2 0 0 1-2-1.5z"/><path d="M8 7a4 4 0 0 1 8 0"/></svg>Vender</button>
  <button class="tab" data-tab="gasto" id="tab-gasto"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M12 9.5v5M9.5 12h5"/></svg>Gasto</button>
  <button class="tab" data-tab="merma" id="tab-merma"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg>Merma</button>
  <button class="tab" data-tab="dia" id="tab-dia"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Día</button>
  <button class="tab" data-tab="mas" id="tab-mas"><svg viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19h14"/></svg>Más</button>
</div></nav>

<script src="sync.js"></script>
<script>
(function(){
"use strict";
const PAGOS=["Efectivo","ATH Móvil","Tarjeta"];
const CATS=["Ingredientes","Empaques","Gas","Luz","Agua","Renta","Nómina","Mantenimiento","Permisos y licencias","Publicidad","Bebidas","Otros"];
const RAZONES=["Sobró al cierre","Se quemó","Se dañó","Error en orden","Otro"];

const S={db:null,dbState:"cargando",cfg:null,tab:"vender",today:ymd(new Date()),
  days:{}, sel:{arroz:[],granos:[],carne:[],side:[]}, precioManual:null, beb:{}, cant:1, metodo:"Efectivo", hoyEdit:false, hoySel:[],
  g:{monto:"",cat:null,desc:"",sup:"",metodo:"Efectivo"},
  m:{comp:null,porc:1,razon:"Sobró al cierre"},
  diaFecha:null, confirmDel:null, exp:{desde:null,hasta:null,rows:null,cargando:false,fallback:null}, menuOpen:false};
S.diaFecha=S.today; S.exp.desde=S.today.slice(0,8)+"01"; S.exp.hasta=S.today;
try{const m=localStorage.getItem("cc_metodo"); if(PAGOS.includes(m)){S.metodo=m;S.g.metodo=m;}}catch(e){}
try{const t=location.hash.slice(1); if(["vender","gasto","merma","dia","mas"].includes(t)) S.tab=t;}catch(e){}

function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function money(n){n=Number(n)||0;return (n<0?"-$":"$")+Math.abs(n).toFixed(2)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function longDate(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("es-PR",{weekday:"long",day:"numeric",month:"short"})}
function ivu(){return (S.cfg&&typeof S.cfg.ivu==="number")?S.cfg.ivu:0.07}

let toastT; function toast(msg){let el=document.getElementById("toast");if(!el){el=document.createElement("div");el.id="toast";el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)}el.textContent=msg;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true},2200)}

/* ---------- data helpers ---------- */
function live(obj){return Object.entries(obj||{}).filter(([,e])=>e&&!e.borrado).map(([id,e])=>Object.assign({id},e)).sort((a,b)=>(a.t||0)-(b.t||0))}
function dayStats(d){
  const v=live(d&&d.ventas), g=live(d&&d.gastos), m=live(d&&d.merma);
  const ventas=v.reduce((s,e)=>s+(e.cant||0)*(e.precio||0),0);
  const platos=v.reduce((s,e)=>s+((e.tipo==='bebida'||e.tipo==='extra')?0:(e.cant||0)),0);
  const extV=v.filter(e=>e.tipo==='extra'), extrasN=extV.reduce((s,e)=>s+(e.cant||0),0), ventasExt=extV.reduce((s,e)=>s+(e.cant||0)*(e.precio||0),0);
  const porExt={}; extV.forEach(e=>{const x=porExt[e.plato]||(porExt[e.plato]={cant:0,monto:0});x.cant+=e.cant||0;x.monto+=(e.cant||0)*(e.precio||0)});
  const bebidas=v.reduce((s,e)=>s+(e.tipo==='bebida'?(e.cant||0):0),0);
  const gastos=g.reduce((s,e)=>s+(Number(e.monto)||0),0);
  const porMet={}; PAGOS.forEach(p=>porMet[p]=0); v.forEach(e=>{porMet[e.metodo]=(porMet[e.metodo]||0)+(e.cant||0)*(e.precio||0)});
  const tasa=e=>typeof e.ivu==="number"?e.ivu:ivu();
  const ivuMonto=v.reduce((s,e)=>s+(e.cant||0)*(e.precio||0)*tasa(e),0);
  const tasas=[...new Set(v.map(tasa))];
  const bebV=v.filter(e=>e.tipo==='bebida'), ventasBeb=bebV.reduce((s,e)=>s+(e.cant||0)*(e.precio||0),0);
  const porBeb={}; bebV.forEach(e=>{const x=porBeb[e.plato]||(porBeb[e.plato]={cant:0,monto:0});x.cant+=e.cant||0;x.monto+=(e.cant||0)*(e.precio||0)});
  return {v,g,m,ventas,platos,bebidas,gastos,porMet,neto:ventas-gastos,ivuMonto,tasas,ventasBeb,ventasPlatos:ventas-ventasBeb-ventasExt,porBeb,extrasN,ventasExt,porExt};
}
function findPlato(a,c,s){if(!S.cfg)return null;return (S.cfg.platos||[]).find(p=>p.arroz===a&&p.carne===c&&p.side===s)||null}

let q=Promise.resolve();

function chips(list,selected,attr){return '<div class="chips">'+list.map(x=>`<button class="chip" data-${attr}="${esc(x)}" aria-pressed="${x===selected}">${esc(x)}</button>`).join("")+'</div>'}
function seg(list,selected,attr){return '<div class="seg" role="group">'+list.map(x=>`<button data-${attr}="${esc(x)}" aria-pressed="${x===selected}">${esc(x)}</button>`).join("")+'</div>'}
function canWrite(){return !!S.db}

const CATEG=[["arroces","Arroz","arroz"],["granos","Granos (opcional)","granos"],["carnes","Carne","carne"],["sides","Side","side"]];
const TIPO={arroces:"Arroz",granos:"Granos",carnes:"Carne",sides:"Side",solos:"Plato solo"};
function bebList(){return (S.cfg&&S.cfg.bebidas)||[]}
function lista(k){return (S.cfg&&S.cfg[k])||[]}
function esDe(k,n){return lista(k).some(b=>b.nombre===n)}
function esBebida(n){return esDe("bebidas",n)}
/* Drinks and extras follow today's menu once any of that kind is marked in it; older menus without them show all. */
function deHoy(k){const m=hoyMenu(),l=lista(k);if(!m||!m.some(n=>esDe(k,n)))return l;return l.filter(b=>m.includes(b.nombre))}
function bebHoy(){return deHoy("bebidas")}
const SUELTOS_HOY=[["agregados","Extras disponibles","Extra","extra"],["bebidas","Bebidas disponibles","Bebida","bebida"]];
function solosList(){return (S.cfg&&S.cfg.solos)||[]}
function agregList(){return (S.cfg&&S.cfg.agregados)||[]}
function findSuelto(n){const a=solosList().find(b=>b.nombre===n);if(a)return {item:a,tipo:"plato",k:"solos"};const g=agregList().find(b=>b.nombre===n);if(g)return {item:g,tipo:"extra",k:"agregados"};const b=bebList().find(x=>x.nombre===n);return b?{item:b,tipo:"bebida",k:"bebidas"}:null}
/* A price of 0 is valid (e.g. "Agua incluida"); only null/empty means "no price yet". */
function hasPrice(x){const p=x&&x.precio;return p!==null&&p!==undefined&&p!==""&&isFinite(p)&&Number(p)>=0}
function precioDe(s){s=String(s==null?"":s).trim().replace(",",".");if(s==="")return null;const v=parseFloat(s);return isFinite(v)&&v>=0?round2(v):null}
function precioTxt(p){return Number(p)===0?"$0 incluido":money(p)}
function hoyMenu(){const d=S.days[S.today];return d&&Array.isArray(d.menu)?d.menu:null}
function enHoy(n){const m=hoyMenu();return !m||m.includes(n)}
function extraDe(n){return Number(S.cfg&&S.cfg.extras&&S.cfg.extras[n])||0}
function base(){return Number(S.cfg&&S.cfg.base)||0}
function allMenuItems(){if(!S.cfg)return [];const out=[];["arroces","granos","carnes","sides"].forEach(k=>(S.cfg[k]||[]).forEach(n=>out.push([n,TIPO[k]])));solosList().forEach(x=>out.push([x.nombre,"Plato solo"]));return out}
/* A plate is any mix of components: zero or more of each kind (e.g. two meats, or meat + side without rice). */
const PARTES=["arroz","granos","carne","side"];
function selVacia(){return {arroz:[],granos:[],carne:[],side:[]}}
function asArr(v){return Array.isArray(v)?v:(v?String(v).split(", ").filter(Boolean):[])}
function selTodos(x){return PARTES.flatMap(k=>asArr(x[k]))}
function platoNombre(x){return selTodos(x).join(" + ")}
/* The base price only applies to a complete plate (rice + meat + side). Anything else is priced by hand,
   and nothing blocks a sale: an item with no price is recorded at $0. */
function esCompleto(sel){return asArr(sel.arroz).length>0&&asArr(sel.carne).length>0&&asArr(sel.side).length>0}
function precioAuto(sel){
  if(base()<=0||!esCompleto(sel)) return null;
  const extras=selTodos(sel).map(n=>[n,extraDe(n)]).filter(x=>x[1]>0);
  return round2(base()+extras.reduce((s,x)=>s+x[1],0));
}
function ticket(){
  const sel=S.sel;
  const algo=selTodos(sel).length>0;
  const extras=selTodos(sel).map(n=>[n,extraDe(n)]).filter(x=>x[1]>0);
  const auto=precioAuto(sel), completo=esCompleto(sel);
  const manual=S.precioManual!=null;
  const precioPlato=manual?S.precioManual:auto;
  const listo=algo||manual;
  const items=[];
  if(listo) items.push({tipo:"plato",nombre:algo?platoNombre(sel):"Plato (sin detalle)",cant:S.cant,precio:precioPlato==null?0:precioPlato,sinPrecio:precioPlato==null});
  Object.entries(S.beb).forEach(([n,c])=>{const f=findSuelto(n);if(f&&c>0)items.push({tipo:f.tipo,suelto:true,nombre:n,cant:c,precio:hasPrice(f.item)?f.item.precio:0,sinPrecio:!hasPrice(f.item)})});
  const subtotal=items.reduce((s,i)=>s+i.cant*i.precio,0);
  const faltan=items.filter(i=>i.sinPrecio).length;
  const ok=items.length>0;
  return {sel,algo,listo,completo,extras,auto,manual,precioPlato,items,subtotal,faltan,ok};
}

function buildRows(docs){
  const out={ventas:[],gastos:[],merma:[]};
  docs.sort((a,b)=>a.fecha<b.fecha?-1:1).forEach(d=>{
    const st=dayStats(d);
    st.v.forEach(e=>out.ventas.push([d.fecha,e.plato,e.cant,e.metodo,Number(e.precio).toFixed(2)]));
    st.g.forEach(e=>out.gastos.push([d.fecha,e.cat,e.desc||"",e.sup||"",Number(e.monto).toFixed(2),e.metodo]));
    st.m.forEach(e=>out.merma.push([d.fecha,e.comp,e.porc,e.razon]));
  });
  return out;
}
function platosRows(){return solosList().concat(agregList()).map(p=>[p.nombre,"","","",hasPrice(p)?Number(p.precio).toFixed(2):""])}
function componentesRows(){return allMenuItems()}
function bebidasRows(){return bebList().map(b=>[b.nombre,b.tam||"",hasPrice(b)?Number(b.precio).toFixed(2):""])}
function rowsFor(kind){return kind==="componentes"?componentesRows():kind==="platos"?platosRows():kind==="bebidas"?bebidasRows():S.exp.rows[kind]}
const HEAD={componentes:["Componente","Tipo"],bebidas:["Bebida","Tamaño","Precio de venta"],ventas:["Fecha","Producto","Cantidad","Método de pago","Precio unitario"],gastos:["Fecha","Categoría","Descripción","Suplidor","Monto","Método de pago"],merma:["Fecha","Componente","Porciones perdidas","Razón"],platos:["Plato","Arroz","Carne","Side","Precio de venta"]};
function tsv(rows){return rows.map(r=>r.map(x=>String(x).replace(/[\t\n]/g," ")).join("\t")).join("\n")}
function csv(rows){return rows.map(r=>r.map(x=>{x=String(x);return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x}).join(",")).join("\r\n")}
async function copyKind(kind){
  const rows=rowsFor(kind); if(!rows.length){toast("No hay filas para copiar.");return}
  const text=tsv(rows);
  try{await navigator.clipboard.writeText(text);S.exp.fallback=null;toast(rows.length+" filas copiadas. Pégalas en "+kind[0].toUpperCase()+kind.slice(1)+".");render()}
  catch(e){S.exp.fallback=text;render();const t=document.getElementById("fallbackTxt");if(t){t.focus();t.select()}}
}
async function csvKind(kind){
  const rows=rowsFor(kind); if(!rows.length){toast("No hay filas.");return}
  bajar(`${kind}_${S.exp.desde}_a_${S.exp.hasta}.csv`,"﻿"+csv([HEAD[kind],...rows]),"text/csv");
  toast("Archivo listo.");
}
function bajar(nombre,texto,tipo){
  const url=URL.createObjectURL(new Blob([texto],{type:tipo+";charset=utf-8"}));
  const a=document.createElement("a");a.href=url;a.download=nombre;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1500);
}

function addSueltoHoy(k){

    const pick=v=>asArr(v).filter(n=>vigentes.includes(n));
    S.sel=selVacia();S.precioManual=null; S.beb={};
    if(u.tipo==="plato"&&selTodos(u).length){PARTES.forEach(k=>{S.sel[k]=pick(u[k])});S.cant=u.cant||1;if(selTodos(S.sel).length&&Number(u.precio)>0&&u.precio!==precioAuto(S.sel))S.precioManual=Number(u.precio)}
    else if(u.plato){S.beb[u.plato]=u.cant||1}
    render();toast("Lista para repetir");return;
  }
  if(b.id==="btnLimpiar"){S.sel=selVacia();S.precioManual=null;S.beb={};S.cant=1;render();return}
  if(d.cant){S.cant=Math.max(1,S.cant+(+d.cant));render();return}
  if(d.metodo){S.metodo=d.metodo;try{localStorage.setItem("cc_metodo",d.metodo)}catch(e){}render();return}
  if(d.gcat){S.g.cat=d.gcat;render();return}
  if(d.gmetodo){S.g.metodo=d.gmetodo;render();return}
  if(d.mcomp){S.m.comp=d.mcomp;render();return}
  if(d.mrazon){S.m.razon=d.mrazon;render();return}
  if(d.porc){S.m.porc=Math.max(0.5,S.m.porc+(+d.porc));render();return}
  if(d.del){S.confirmDel=d.del;render();return}
  if(d.delno){S.confirmDel=null;render();return}
  if(d.delok){const [f,k,id]=d.delok.split("|");S.confirmDel=null;b.disabled=true;deleteEntry(f,k,id).then(()=>toast("Borrado")).catch(e=>{toast(errMsg(e));render()});return}
  if(b.id==="btnVenta"){
    const T=ticket(); if(!T.ok)return;
    const j=k=>asArr(S.sel[k]).join(", "), now=Date.now(), entries=[];
    if(T.listo) entries.push({t:now,tipo:"plato",plato:T.items[0].nombre,arroz:j("arroz"),granos:j("granos"),carne:j("carne"),side:j("side"),cant:S.cant,precio:T.precioPlato==null?0:T.precioPlato,metodo:S.metodo,ivu:ivu()});
    T.items.filter(i=>i.suelto).forEach((i,k)=>entries.push({t:now+k+1,tipo:i.tipo,plato:i.nombre,cant:i.cant,precio:i.precio,metodo:S.metodo,ivu:ivu()}));
    b.disabled=true; const total=T.subtotal, faltan=T.faltan;
    writeEntries("ventas",entries).then(()=>{toast("Vendido · "+money(total)+(faltan?" (algo sin precio, a $0)":""));S.sel=selVacia();S.precioManual=null;S.beb={};S.cant=1;render()}).catch(e=>{toast(errMsg(e));render()});
    return;
  }
  if(b.id==="btnGasto"){
    const g=S.g, monto=round2(parseFloat(g.monto)||0); if(monto<=0||!g.cat)return;
    b.disabled=true;
    writeEntry("gastos",{t:Date.now(),cat:g.cat,desc:g.desc.trim(),sup:g.sup.trim(),monto,metodo:g.metodo}).then(()=>{toast("Gasto registrado · "+money(monto));S.g={monto:"",cat:null,desc:"",sup:"",metodo:g.metodo};render()}).catch(e=>{toast(errMsg(e));render()});
    return;
  }
  if(b.id==="btnMerma"){
    const m=S.m; b.disabled=true;
    writeEntry("merma",{t:Date.now(),comp:m.comp,porc:m.porc,razon:m.razon}).then(()=>{toast("Merma registrada");S.m={comp:null,porc:1,razon:m.razon};render()}).catch(e=>{toast(errMsg(e));render()});
    return;
  }
  if(b.id==="btnVerClave"){
    ev.preventDefault(); S.verClave=!S.verClave;
    const i=document.getElementById("cxClave"); if(i) i.type=S.verClave?"text":"password";
    b.textContent=S.verClave?"Ocultar":"Ver"; b.setAttribute("aria-pressed",String(S.verClave)); b.setAttribute("aria-label",S.verClave?"Ocultar la clave":"Ver la clave");
    return;
  }
  if(b.id==="btnCx"){
    const cx=S.cx||{}; S.cxProbando=true; render();
    const r=await window.CC_DB.guardarConexion({url:cx.url,clave:cx.clave,equipo:cx.equipo||"Tablet"});
    S.cxProbando=false; toast(r.ok?(cx.url?`Conectado a "${r.hoja}"`:"Conexión quitada"):r.error); render(); return;
  }
  if(b.id==="btnSync"){window.CC_DB.sync().then(()=>{const e=window.CC_DB.estado();toast(e.error?e.error:(e.pendientes?e.pendientes+" por enviar":"Todo enviado"))});return}
  if(b.id==="btnRespaldo"){bajar(`caja-criolla-respaldo_${S.today}.json`,JSON.stringify(window.CC_DB.respaldo(),null,1),"application/json");toast("Respaldo listo.");return}
  if(b.id==="btnCargar"){
    if(S.exp.desde>S.exp.hasta){toast("La fecha 'Desde' va antes de 'Hasta'.");return}
    S.exp.cargando=true;S.exp.fallback=null;render();
    try{const snap=await S.db.collection("dias").where("fecha",">=",S.exp.desde).where("fecha","<=",S.exp.hasta).limit(400).get();
      S.exp.rows=buildRows(snap.docs.map(x=>x.data()));}
    catch(e){toast(errMsg(e))}
    S.exp.cargando=false;render();return;
  }
  if(d.copy){copyKind(d.copy);return}
  if(d.csv){csvKind(d.csv);return}
  if(b.id==="btnMenu"){S.menuOpen=!S.menuOpen;render();return}
  if(d.xadd){const k=d.xadd,nm=(document.getElementById("addN-"+k).value||"").trim(),pr=precioDe(document.getElementById("addP-"+k).value);if(!nm){toast("Escribe el nombre.");return}if(findSuelto(nm)){toast("Ese producto ya está.");return}const n=clone(S.cfg);n[k]=(n[k]||[]);n[k].push({nombre:nm,precio:pr});saveCfg(n).then(()=>toast(nm+" añadido"+(pr!==null?" · "+precioTxt(pr):" (sin precio)"))).catch(e=>toast(errMsg(e)));return}
  if(d.xdel){const [k,i]=d.xdel.split("|");const n=clone(S.cfg);n[k].splice(+i,1);saveCfg(n).then(()=>toast("Quitado")).catch(e=>toast(errMsg(e)));return}
  if(d.cdel){const [k,i]=d.cdel.split("|");const n=clone(S.cfg);n[k].splice(+i,1);saveCfg(n).catch(e=>toast(errMsg(e)));return}
  if(d.cadd){const inp=document.getElementById("add-"+d.cadd);const v=(inp.value||"").trim();if(!v)return;const n=clone(S.cfg);n[d.cadd]=(n[d.cadd]||[]);if(!n[d.cadd].includes(v))n[d.cadd].push(v);saveCfg(n).then(()=>toast("Añadido")).catch(e=>toast(errMsg(e)));return}
});

/* ---------- subscriptions ---------- */
const subs={};
function watchDay(fecha){
  if(!S.db||subs[fecha])return;
  // keep at most today + one other day subscribed
  Object.keys(subs).forEach(k=>{if(k!==S.today&&k!==fecha){subs[k]();delete subs[k];delete S.days[k]}});
  subs[fecha]=S.db.doc("dias/"+fecha).onSnapshot(s=>{const d=s.exists?s.data():null;const same=JSON.stringify(d)===JSON.stringify(S.days[fecha]);S.days[fecha]=d;if(!same)render()},e=>{S.days[fecha]=null;render()});
}
/* ---------- conexión / sync status ---------- */
function syncTexto(e){
  if(!e.conectado) return ["off","Sin conectar"];
  if(e.pendientes&&!e.online) return ["off",`Sin internet · ${e.pendientes} por enviar`];
  if(e.error&&e.pendientes) return ["err",`${e.pendientes} por enviar`];
  if(e.error) return ["err","Error al conectar"];
  if(e.pendientes) return ["pend",e.enviando?`Enviando ${e.pendientes}…`:`${e.pendientes} por enviar`];
  return ["ok","Enviado a la hoja"];
}
function pintarSync(e){
  const b=document.getElementById("hdrSync"),t=document.getElementById("hdrSyncT"); if(!b)return;
  const [c,txt]=syncTexto(e); b.className="syncpill "+c; t.textContent=txt;
  const x=document.getElementById("cxEstado"); if(x) x.innerHTML=cxEstadoHTML(e);
}
function cxEstadoHTML(e){
  const [,txt]=syncTexto(e);
  let h=`<b>${esc(txt)}</b>`;
  if(e.error) h+=`<br><span class="small">${esc(e.error)}</span>`;
  if(e.ultimoOk) h+=`<br><span class="small muted">Última vez: ${new Date(e.ultimoOk).toLocaleTimeString("es-PR",{hour:"numeric",minute:"2-digit"})}</span>`;
  return h;
}
document.getElementById("hdrSync").addEventListener("click",()=>{S.tab="mas";render();window.scrollTo(0,0)});
window.CC_DB.onEstado(e=>{pintarSync(e); if(!editing()&&S.tab==="mas"&&!document.getElementById("cxEstado"))render()});
if("serviceWorker" in navigator&&location.protocol==="https:"){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}

const MENU_VACIO={ivu:0.07,base:null,arroces:[],granos:[],carnes:[],sides:[],solos:[],agregados:[],bebidas:[],extras:{}};
render();
(async()=>{
  const db=window.CC_DB;
  S.db=db;S.dbState="ok";
  db.doc("config/menu").onSnapshot(s=>{const d=s.exists?s.data():clone(MENU_VACIO);const same=S.cfgLoaded&&JSON.stringify(d)===JSON.stringify(S.cfg);S.cfg=d;S.cfgLoaded=true;if(!same)render()},()=>{render()});
  watchDay(S.today);
  if(S.diaFecha!==S.today)watchDay(S.diaFecha);
  // roll over to a new day if the app stays open past midnight
  setInterval(()=>{const t=ymd(new Date());if(t!==S.today){S.today=t;watchDay(t);render()}},60000);
})();
})();
